<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fight Tom Pearl - Undertale Boss Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="screen-wrapper">
      <canvas id="gameCanvas" width="800" height="640"></canvas>
      
      <!-- Start Overlay (для разблокировки Web Audio и музыки) -->
      <div id="start-overlay" class="overlay">
        <div class="overlay-box">
          <h1 class="glitch-title">FIGHT TOM PEARL</h1>
          <p class="subtitle">UNDERTALE EDITION</p>
          <div class="instructions">
            <p><span class="key">[СТРЕЛКИ]</span> или <span class="key">[W A S D]</span> — Движение Души</p>
            <p><span class="key">[ Z ]</span> или <span class="key">[ПРОБЕЛ]</span> — Стрельба Желтой Души / Диалог</p>
            <p><span class="key">[ P ]</span> — Пауза &nbsp;|&nbsp; <span class="key">[ M ]</span> — Звук Вкл/Выкл</p>
          </div>
          <button id="start-btn" class="btn">НАЧАТЬ БИТВУ</button>
        </div>
      </div>

      <!-- Pause Overlay -->
      <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-box">
          <h2>ПАУЗА</h2>
          <p>Нажмите <span class="key">[ P ]</span> чтобы продолжить</p>
          <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/attacks.js"></script>
  <script src="js/player.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
